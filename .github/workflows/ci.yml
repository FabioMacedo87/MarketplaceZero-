name: PublicaFix CI

on:
  push:
    branches:
      - feat/publicafix-production-foundation
  pull_request:
    branches:
      - main
      - feat/publicafix-production-foundation

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Node.js
        uses: actions/setup-node@1e60f620b9541d5540e9fb989e2f3f5f3
        with:
          node-version: '22.12.0'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Type-check
        run: npm run lint

      - name: Build production bundle
        run: npm run build
