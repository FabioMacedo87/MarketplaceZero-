name: PublicaFix CI
# This workflow validates the live, non-billing static-audit beta.

on:
  push:
    branches:
      - feat/publicafix-production-foundation
      - feat/publicafix-real-audit-mvp
  pull_request:
    branches:
      - main
      - feat/publicafix-production-foundation
      - feat/publicafix-real-audit-mvp

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22.12.0'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run static-audit tests
        run: npm test
      - name: Type-check
        run: npm run lint
      - name: Build production bundle
        run: npm run build
